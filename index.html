<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> login page </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#182e4b,#0f5fc7);
}

.login-container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.login-container h2{
    text-align:center;
    margin-bottom:25px;
}

.login-image{
    display:block;
    width:180px;
    height:auto;
    margin:0 auto 20px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.login-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:5px;
    background:#0f5fc7;
    color:rgb(187, 198, 212);
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background: #08111d;;
}
</style>
</head>
<body>

<div class="login-container">
    <img class="login-image" src="../OGO.png" alt="RainGuard Logo" style="width: 180px; height: auto;">
    <h2>Login</h2>

    <form onsubmit="return checkLogin()">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
    </form>
</div>

<script>
function checkLogin() {
    var correctEmail = "bavankannaa@g.com";
    var correctPassword = "974324777";

    var email = document.getElementById("email").value.trim().toLowerCase();
    var password = document.getElementById("password").value;

    if (email === correctEmail && password === correctPassword) {
        alert("Login Successful!");
        window.location.assign("./main.html");
        return false;
    } else {
        alert("Incorrect Email or Password!");
        return false;
    }
}
</script>

</body>
</html>
